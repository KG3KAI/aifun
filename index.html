<head>

<meta name="description" content="AI 做的轻量化大作，一个入口一键开玩。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="logo">
        <div class="coin">AI</div>
        <div>
          <h1><b>AI</b> FUN</h1>
          <div class="sub">AI 做的游戏 · 一键开玩</div>
        </div>
      </div>
      <div class="count" id="count"></div>

    <div class="marquee"><span class="track" id="track"></span></div>

    <div class="sec-title">游戏大厅</div>
    <div class="grid" id="grid"></div>

    </footer>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lb-bar">
      <span class="t" id="lb-title"></span>
      <button class="x" id="lb-close" title="关闭">✕</button>
    </div>
    <iframe class="lb-frame" id="frame" allowfullscreen allow="autoplay; fullscreen; gamepad; xr-spatial-tracking"></iframe>
  </div>

  <script src="js/games.js"></script>
  <script src="js/main.js"></script>
