<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIPY · 点开就嗨</title>
<meta name="description" content="AIPY —— AI 做的轻量化大作，点开就嗨。">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="scanlines"></div>

  <div class="wrap">
    <header class="top">
      <div class="logo">
        <div class="coin">AI</div>
        <div>
          <h1><b>AIPY</b></h1>
          <div class="sub">点开就嗨</div>
        </div>
      </div>
      <div class="count" id="count"></div>
    </header>

    <div class="marquee"><span class="track" id="track"></span></div>

    <!-- 搜索 + 分类 -->
    <div class="controls">
      <div class="search">
        <span class="s-icon">🔍</span>
        <input id="search" type="text" placeholder="搜一台机器… 比如「射击」「塞尔达」">
        <button class="s-clear" id="s-clear" title="清除">✕</button>
      </div>
      <div class="cats" id="cats"></div>
    </div>

    <div class="sec-title"><span id="sec-label">游戏大厅</span><span class="sec-note" id="sec-note"></span></div>
    <div class="arcade" id="arcade"></div>
    <div class="empty" id="empty" style="display:none">没有找到匹配的游戏，换个关键词试试 🕹️</div>

    <footer class="footer">
      <p><b>AIPY</b> —— AI 做的轻量化大作集合。本站为个人小站，游戏均为 AI 复刻 / 网页轻量版，仅供学习交流与试玩。</p>
      <p>外链游戏版权归原作者所有；本地「几猫港区」为 AI 生成内容。本站仅提供入口，不存储外部游戏文件。如有版权问题请联系下架。</p>
    </footer>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lb-bar">
      <button class="lb-back" id="lb-back" title="返回大厅">← 返回大厅</button>
      <span class="t" id="lb-title"></span>
      <button class="x" id="lb-close" title="关闭">✕</button>
    </div>
    <iframe class="lb-frame" id="frame" allowfullscreen allow="autoplay; fullscreen; gamepad; xr-spatial-tracking"></iframe>
  </div>

  <script src="js/games.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
